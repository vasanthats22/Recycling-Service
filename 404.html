<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <title>Recycling Service - 404 Page Not Found</title>

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />

  <!-- AOS — Animate On Scroll -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Roboto, 'Helvetica Neue', system-ui, sans-serif;
    }

    html, body { overflow-x: hidden; }

    body {
      background: #f0f8ff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      position: relative;
    }

    /* Soft background accents */
    body::before,
    body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.35;
      z-index: 0;
      pointer-events: none;
    }
    body::before {
      width: 380px; height: 380px;
      background: #4FC3F7;
      top: -120px; left: -120px;
    }
    body::after {
      width: 420px; height: 420px;
      background: #29B6F6;
      bottom: -150px; right: -150px;
      opacity: 0.25;
    }

    /* ===== 404 CARD ===== */
    .error-card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 1100px;
      background: #ffffff;
      border-radius: 26px;
      box-shadow: 0 30px 70px rgba(0, 61, 122, 0.18);
      display: grid;
      grid-template-columns: 1fr 1fr;
      overflow: hidden;
      border: 1.5px solid rgba(79, 195, 247, 0.35);
    }

    /* ===== LEFT: IMAGE ===== */
    .error-visual {
      position: relative;
      background: linear-gradient(135deg, #003D7A 0%, #0D5BA6 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 50px 30px;
      min-height: 520px;
      overflow: hidden;
    }

    .error-visual::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 20% 25%, rgba(79, 195, 247, 0.35), transparent 55%),
        radial-gradient(circle at 85% 80%, rgba(41, 182, 246, 0.3), transparent 55%);
      pointer-events: none;
    }

    .error-visual img {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 380px;
      height: auto;
      object-fit: contain;
      filter: drop-shadow(0 18px 35px rgba(0, 20, 45, 0.45));
      animation: floatY 4.5s ease-in-out infinite;
    }

    @keyframes floatY {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-14px); }
    }

    .error-visual .fallback-icon {
      position: relative;
      z-index: 1;
      font-size: 9rem;
      color: #4FC3F7;
      filter: drop-shadow(0 14px 30px rgba(0, 20, 45, 0.5));
      animation: floatY 4.5s ease-in-out infinite;
      display: none;
    }

    /* ===== RIGHT: CONTENT ===== */
    .error-content {
      padding: 70px 60px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
    }

    .error-badge {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      background: rgba(79, 195, 247, 0.14);
      color: #003D7A;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 1.4px;
      text-transform: uppercase;
      padding: 8px 16px;
      border-radius: 60px;
      border: 1px solid rgba(79, 195, 247, 0.45);
      margin-bottom: 22px;
    }
    .error-badge i { color: #29B6F6; font-size: 0.9rem; }

    .error-code {
      font-size: 4.6rem;
      font-weight: 800;
      line-height: 1;
      color: #003D7A;
      letter-spacing: -2px;
      margin-bottom: 6px;
    }
    .error-code span {
      color: #29B6F6;
      text-shadow: 0 4px 18px rgba(41, 182, 246, 0.35);
    }

    .error-title {
      font-size: 1.7rem;
      font-weight: 700;
      color: #003D7A;
      margin-bottom: 14px;
      letter-spacing: -0.4px;
    }

    .error-text {
      font-size: 1rem;
      line-height: 1.75;
      color: #4a6b7c;
      margin-bottom: 32px;
      max-width: 440px;
    }
    .error-text .highlight {
      color: #003D7A;
      font-weight: 700;
      background: linear-gradient(180deg, transparent 62%, rgba(79, 195, 247, 0.3) 62%);
      padding: 0 3px;
      border-radius: 2px;
    }

    /* ===== BUTTONS ===== */
    .error-actions {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 0.85rem 1.85rem;
      border-radius: 60px;
      font-size: 0.95rem;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      text-decoration: none;
      border: 1.5px solid transparent;
      transition: all 0.3s ease;
      white-space: nowrap;
    }

    .btn-primary {
      background: #29B6F6;
      border-color: #29B6F6;
      color: #003D7A;
      box-shadow: 0 10px 24px rgba(41, 182, 246, 0.35);
    }
    .btn-primary i { color: #003D7A; }
    .btn-primary:hover {
      background: #4FC3F7;
      border-color: #4FC3F7;
      transform: translateY(-3px);
      box-shadow: 0 14px 30px rgba(41, 182, 246, 0.45);
    }

    .btn-secondary {
      background: transparent;
      border-color: #003D7A;
      color: #003D7A;
    }
    .btn-secondary i { color: #003D7A; }
    .btn-secondary:hover {
      background: #003D7A;
      color: #ffffff;
      transform: translateY(-3px);
      box-shadow: 0 12px 26px rgba(0, 61, 122, 0.3);
    }
    .btn-secondary:hover i { color: #ffffff; }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 900px) {
      .error-card {
        grid-template-columns: 1fr;
        max-width: 620px;
      }
      .error-visual { min-height: 300px; padding: 40px 24px; }
      .error-visual img { max-width: 240px; }
      .error-visual .fallback-icon { font-size: 6rem; }

      .error-content {
        padding: 50px 40px;
        align-items: center;
        text-align: center;
      }
      .error-text { max-width: 100%; }
      .error-actions { justify-content: center; }
    }

    @media (max-width: 480px) {
      body { padding: 24px 16px; }
      .error-card { border-radius: 20px; }
      .error-visual { min-height: 240px; padding: 32px 20px; }
      .error-visual img { max-width: 190px; }
      .error-visual .fallback-icon { font-size: 4.8rem; }

      .error-content { padding: 38px 24px; }
      .error-code { font-size: 3.4rem; }
      .error-title { font-size: 1.35rem; }
      .error-text { font-size: 0.92rem; margin-bottom: 26px; }

      .error-actions { width: 100%; flex-direction: column; }
      .btn { width: 100%; padding: 0.85rem 1.4rem; }
    }
  </style>
</head>
<body>

  <div class="error-card">

    <!-- ===== LEFT: IMAGE ===== -->
    <div class="error-visual"
         data-aos="fade-right"
         data-aos-duration="900">
      <img
        src="recycle4.webp"
        alt="Page not found illustration"
        onerror="this.style.display='none'; this.nextElementSibling.style.display='block';"
      />
      <i class="fa-solid fa-recycle fallback-icon"></i>
    </div>

    <!-- ===== RIGHT: CONTENT ===== -->
    <div class="error-content">

      <span class="error-badge"
            data-aos="fade-down"
            data-aos-delay="100">
        <i class="fa-solid fa-triangle-exclamation"></i>
        Error 404
      </span>

      <h1 class="error-code"
          data-aos="zoom-in"
          data-aos-delay="200">
        4<span>0</span>4
      </h1>

      <h2 class="error-title"
          data-aos="fade-up"
          data-aos-delay="300">
        Oops! This page went missing.
      </h2>

      <p class="error-text"
         data-aos="fade-up"
         data-aos-delay="400">
        Looks like the page you're looking for has been <span class="highlight">recycled</span>
        or moved somewhere else. Let's get you back on the green path.
      </p>

      <div class="error-actions"
           data-aos="fade-up"
           data-aos-delay="500">
        <a href="index.html" class="btn btn-primary">
          <i class="fa-solid fa-house"></i> Back to Home
        </a>
        <a href="javascript:void(0)" class="btn btn-secondary" onclick="history.back()">
          <i class="fa-solid fa-arrow-left"></i> Go Back
        </a>
      </div>

    </div>

  </div>

  <!-- AOS JS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
  <script>
    AOS.init({
      duration: 800,
      easing: 'ease-out-cubic',
      once: true,
      offset: 60,
      mirror: false
    });
  </script>

</body>
</html>
